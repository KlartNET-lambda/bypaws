version: '3'

vars:
    PROJECT_NAME: 'bypaws'
    FLAGS: '-gcflags=all="-B" -ldflags="-s -w" -trimpath'

tasks:
    tidy:
        desc: Clean dependencies
        cmds:
            - go mod tidy

    clean:
        desc: Clean output directory
        deps: [tidy]
        cmds:
            - rm -rf bin/

    build:
        desc: Build multi-platform
        deps: [clean]
        cmds:
            - for:
                - { GOOS: 'windows', GOARCH: 'amd64', EXT: '.exe' }
                - { GOOS: 'linux', GOARCH: 'amd64', EXT: '' }
              vars:
                GOOS: "{{.ITEM.GOOS}}"
                GOARCH: "{{.ITEM.GOARCH}}"
                EXT: "{{.ITEM.EXT}}"
              task: build-target

    build-target:
        internal: true
        env:
            GOOS: "{{.GOOS}}"
            GOARCH: "{{.GOARCH}}"
        cmds:
            - go build {{.FLAGS}} -o "./bin/{{.PROJECT_NAME}}-{{.GOOS}}-{{.GOARCH}}{{.EXT}}" ./src